<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MedTrack-Pro - Pharmacy Inventory</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body class="bg-slate-50 min-h-screen">
<div class="bg-white p-4 shadow flex justify-between items-center sticky top-0 z-10">
<div class="flex gap-3 items-center">
<div class="w-10 h-10 bg-teal-600 rounded-xl flex items-center justify-center text-white"><i class="fas fa-capsules"></i></div>
<div><h1 class="font-bold">MedTrack-Pro</h1><p class="text-xs text-slate-500">Pharmacy Inventory</p></div>
</div>
<div class="w-8 h-8 bg-teal-600 rounded-full flex items-center justify-center text-white font-bold text-sm">JD</div>
</div>
<div class="p-4 max-w-6xl mx-auto">
<div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-4">
<div class="bg-white p-4 rounded-xl shadow"><p class="text-xs text-slate-500">Total Medicines</p><h2 class="text-xl font-bold" id="totalMeds">0</h2></div>
<div class="bg-white p-4 rounded-xl shadow"><p class="text-xs text-slate-500">Low Stock</p><h2 class="text-xl font-bold text-amber-600" id="lowStockCount">0</h2></div>
<div class="bg-white p-4 rounded-xl shadow border-l-4 border-red-500"><p class="text-xs text-slate-500">Expiring Soon</p><h2 class="text-xl font-bold text-red-600" id="expiryCount">0</h2></div>
<div class="bg-white p-4 rounded-xl shadow"><p class="text-xs text-slate-500">Total Profit</p><h2 class="text-xl font-bold text-green-600" id="totalProfit">Rs 0</h2></div>
</div>
<div class="flex flex-wrap gap-2 mb-4">
<button onclick="openAddModal()" class="bg-teal-600 text-white px-4 py-2 rounded-lg text-sm"><i class="fas fa-plus mr-2"></i>Add Medicine</button>
<button onclick="generateLowStockPDF()" class="bg-amber-600 text-white px-4 py-2 rounded-lg text-sm"><i class="fas fa-file-pdf mr-2"></i>Low Stock PDF</button>
<button onclick="generateExpiryPDF()" class="bg-red-600 text-white px-4 py-2 rounded-lg text-sm"><i class="fas fa-clock mr-2"></i>Expiry Report</button>
</div>
<div class="bg-white p-3 rounded-xl shadow mb-4 flex items-center gap-2">
<i class="fas fa-search text-slate-400"></i>
<input id="search" oninput="render()" placeholder="Search medicine..." class="w-full outline-none text-sm">
</div>
<div class="bg-white rounded-xl shadow overflow-hidden">
<div class="overflow-x-auto">
<table class="w-full text-sm">
<thead class="bg-slate-100 text-left"><tr>
<th class="p-3">Medicine</th><th class="p-3">Stock</th><th class="p-3">Expiry</th><th class="p-3">Price</th><th class="p-3">Profit</th><th class="p-3">Action</th>
</tr></thead>
<tbody id="tbody"></tbody>
</table>
</div>
</div>
</div>
<div id="modal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50">
<div class="bg-white rounded-xl p-5 w-full max-w-md">
<h3 class="font-bold mb-3" id="modalTitle">Add Medicine</h3>
<input id="mName" placeholder="Medicine Name" class="w-full border p-2 rounded mb-2">
<input id="mStock" type="number" placeholder="Stock Qty" class="w-full border p-2 rounded mb-2">
<input id="mMinStock" type="number" placeholder="Min Stock Alert (e.g. 10)" class="w-full border p-2 rounded mb-2">
<input id="mExpiry" type="date" class="w-full border p-2 rounded mb-2">
<input id="mBuy" type="number" placeholder="Buy Price" class="w-full border p-2 rounded mb-2">
<input id="mSell" type="number" placeholder="Sell Price" class="w-full border p-2 rounded mb-2">
<div class="flex gap-2">
<button onclick="saveMed()" class="bg-teal-600 text-white flex-1 py-2 rounded">Save</button>
<button onclick="closeModal()" class="bg-slate-200 flex-1 py-2 rounded">Cancel</button>
</div>
</div>
</div>
<script>
let meds = JSON.parse(localStorage.getItem('meds')||'[]');
let editIndex = -1;
function openAddModal(){editIndex=-1;document.getElementById('modalTitle').innerText='Add Medicine';['mName','mStock','mMinStock','mExpiry','mBuy','mSell'].forEach(id=>document.getElementById(id).value='');document.getElementById('modal').classList.remove('hidden');}
function closeModal(){document.getElementById('modal').classList.add('hidden');}
function saveMed(){
 let m={name:document.getElementById('mName').value,stock:parseInt(document.getElementById('mStock').value),minStock:parseInt(document.getElementById('mMinStock').value)||10,expiry:document.getElementById('mExpiry').value,buy:parseFloat(document.getElementById('mBuy').value),sell:parseFloat(document.getElementById('mSell').value)};
 if(!m.name) return alert('Name required');
 if(editIndex>=0) meds[editIndex]=m; else meds.push(m);
 localStorage.setItem('meds',JSON.stringify(meds));closeModal();render();
}
function render(){
 let q=document.getElementById('search').value.toLowerCase();
 let filtered=meds.filter(x=>x.name.toLowerCase().includes(q));
 let tbody=document.getElementById('tbody');tbody.innerHTML='';
 let low=0,exp=0,profit=0;
 let today=new Date(); today.setHours(0,0,0,0);
 meds.forEach((m,i)=>{
   if(m.stock<=m.minStock) low++;
   let ed=new Date(m.expiry); let diff=Math.ceil((ed-today)/86400000);
   if(diff<=30) exp++;
   profit+=(m.sell-m.buy)*m.stock;
 });
 document.getElementById('totalMeds').innerText=meds.length;
 document.getElementById('lowStockCount').innerText=low;
 document.getElementById('expiryCount').innerText=exp;
 document.getElementById('totalProfit').innerText='Rs '+profit.toFixed(0);
 filtered.forEach((m,i)=>{
   let idx=meds.indexOf(m);
   let ed=new Date(m.expiry); let diff=Math.ceil((ed-new Date())/86400000);
   let expClass = diff<=30 ? 'bg-red-50 border-l-4 border-red-500' : diff<=90 ? 'bg-amber-50' : '';
   let stockClass = m.stock<=m.minStock ? 'text-red-600 font-bold' : '';
   let expiryText = diff<0 ? '<span class=text-red-600>EXPIRED</span>' : diff<=30 ? `<span class=text-red-600>${m.expiry} (${diff}d left)</span>` : m.expiry;
   tbody.innerHTML+=`<tr class="${expClass} border-b">
   <td class="p-3 font-medium">${m.name}</td>
   <td class="p-3 ${stockClass}">${m.stock}</td>
   <td class="p-3">${expiryText}</td>
   <td class="p-3">Rs ${m.sell}</td>
   <td class="p-3 text-green-600">Rs ${(m.sell-m.buy)*m.stock}</td>
   <td class="p-3"><button onclick="editMed(${idx})" class="text-blue-600 mr-2"><i class="fas fa-pen"></i></button><button onclick="delMed(${idx})" class="text-red-600"><i class="fas fa-trash"></i></button></td>
   </tr>`;
 });
}
function editMed(i){editIndex=i;let m=meds[i];document.getElementById('mName').value=m.name;document.getElementById('mStock').value=m.stock;document.getElementById('mMinStock').value=m.minStock;document.getElementById('mExpiry').value=m.expiry;document.getElementById('mBuy').value=m.buy;document.getElementById('mSell').value=m.sell;document.getElementById('modalTitle').innerText='Edit Medicine';document.getElementById('modal').classList.remove('hidden');}
function delMed(i){if(confirm('Delete?')){meds.splice(i,1);localStorage.setItem('meds',JSON.stringify(meds));render();}}
function generateLowStockPDF(){
 const {jsPDF}=window.jspdf; const doc=new jsPDF();
 let lowMeds=meds.filter(m=>m.stock<=m.minStock);
 doc.text('MedTrack-Pro - Low Stock Report',10,10);
 doc.text('Date: '+new Date().toLocaleDateString(),10,18);
 let y=30; doc.text('Medicine | Stock | Min Stock',10,y); y+=8;
 lowMeds.forEach(m=>{doc.text(`${m.name} | ${m.stock} | ${m.minStock}`,10,y); y+=7;});
 if(lowMeds.length==0) doc.text('All stocks are OK!',10,y);
 doc.save('Low-Stock-Report.pdf');
}
function generateExpiryPDF(){
 const {jsPDF}=window.jspdf; const doc=new jsPDF();
 let today=new Date();
 let expMeds=meds.filter(m=>{let d=new Date(m.expiry); return (d-today)/86400000 <=30;});
 doc.text('MedTrack-Pro - Expiry Alert Report (30 Days)',10,10);
 let y=20; expMeds.forEach(m=>{doc.text(`${m.name} - Exp: ${m.expiry} - Stock: ${m.stock}`,10,y); y+=7;});
 if(expMeds.length==0) doc.text('No medicines expiring soon!',10,y);
 doc.save('Expiry-Report.pdf');
}
render();
</script>
</body>
</html>
