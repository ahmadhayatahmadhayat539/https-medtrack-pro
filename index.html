<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MedTrack-Pro</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<style>body{background:#eef2f7}.box{max-width:500px;margin:20px auto;background:#fff;padding:20px;border-radius:15px;box-shadow:0 5px 15px rgba(0,0,0,0.1)}.head{background:linear-gradient(135deg,#0d6efd,#0dcaf0);color:#fff;padding:15px;border-radius:10px;text-align:center}</style>
</head>
<body>
<div class="box">
<div class="head"><h3>💊 MedTrack-Pro</h3><p>Pharmacy System LIVE</p></div>
<div class="mt-3">
<input id="name" class="form-control mb-2" placeholder="Dawa ka naam">
<input id="qty" type="number" class="form-control mb-2" placeholder="Qty">
<input id="buy" type="number" class="form-control mb-2" placeholder="Kharid Price">
<input id="sell" type="number" class="form-control mb-2" placeholder="Frokht Price">
<button class="btn btn-primary w-100" onclick="add()">Add Medicine +</button>
</div>
<div class="mt-3"><h5>Total Profit: <span id="tp" class="text-success">0 Rs</span></h5><div id="list"></div></div>
</div>
<script>
let meds=JSON.parse(localStorage.getItem('meds')||'[]');
function add(){let m={name:document.getElementById('name').value,qty:+document.getElementById('qty').value,buy:+document.getElementById('buy').value,sell:+document.getElementById('sell').value,id:Date.now()};if(!m.name)return alert('Naam likhein');meds.push(m);localStorage.setItem('meds',JSON.stringify(meds));render();}
function render(){let l=document.getElementById('list');l.innerHTML='';let t=0;meds.forEach(m=>{let p=(m.sell-m.buy)*m.qty;t+=p;l.innerHTML+=`<div class="p-2 bg-light mt-2 rounded"><b>${m.name}</b> - Qty:${m.qty} <span class="text-success">Profit:${p} Rs</span></div>`});document.getElementById('tp').innerText=t+' Rs';}
render();
</script>
</body>
</html>
