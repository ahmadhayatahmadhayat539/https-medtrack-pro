<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Medicine Stock Manager</title>
<style>
  *{box-sizing:border-box;font-family:system-ui,Segoe UI,Arial,sans-serif}
  body{margin:0;background:#f4f6f9;color:#1f2937}
  header{background:#1f4e78;color:#fff;padding:16px 24px}
  header h1{margin:0;font-size:20px}
  .wrap{max-width:1200px;margin:20px auto;padding:0 16px}
  .dash{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px}
  .card{background:#fff;border-radius:10px;padding:14px;box-shadow:0 1px 4px rgba(0,0,0,.08);text-align:center}
  .card .n{font-size:24px;font-weight:700}
  .card.red .n{color:#ea4335}.card.orange .n{color:#f59e0b}
  .card.green .n{color:#34a853}.card.blue .n{color:#1f4e78}
  form{background:#fff;border-radius:10px;padding:16px;display:grid;
       grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;
       box-shadow:0 1px 4px rgba(0,0,0,.08);margin-bottom:20px}
  form label{font-size:12px;font-weight:600;color:#4b5563;display:block;margin-bottom:4px}
  form input,form select{width:100%;padding:8px;border:1px solid #d1d5db;border-radius:6px;font-size:14px}
  .btns{grid-column:1/-1;display:flex;gap:10px;flex-wrap:wrap}
  button{padding:9px 16px;border:0;border-radius:6px;cursor:pointer;font-weight:600;font-size:14px}
  .primary{background:#1f4e78;color:#fff}.primary:hover{background:#163a5a}
  .ghost{background:#e5e7eb;color:#1f2937}.ghost:hover{background:#d1d5db}
  .danger{background:#ea4335;color:#fff}
  table{width:100%;border-collapse:collapse;background:#fff;border-radius:10px;overflow:hidden;
        box-shadow:0 1px 4px rgba(0,0,0,.08);font-size:14px}
  th,td{padding:10px 12px;text-align:left;border-bottom:1px solid #eef0f3}
  th{background:#2f75b5;color:#fff;font-size:12px;text-transform:uppercase;letter-spacing:.5px}
  tr:hover td{background:#f9fafb}
  .pill{display:inline-block;padding:3px 10px;border-radius:12px;font-size:11px;font-weight:700}
  .p-red{background:#fde2e0;color:#a81c0f}
  .p-orange{background:#fef0d4;color:#8a5a00}
  .p-green{background:#dcf5e3;color:#0f6b2f}
  .search{padding:8px 12px;border:1px solid #d1d5db;border-radius:6px;width:260px;margin-bottom:12px}
  .empty{text-align:center;color:#9ca3af;padding:30px}
</style>
</head>
<body>
<header><h1>💊 Medicine Stock Manager</h1></header>
<div class="wrap">

  <div class="dash">
    <div class="card red"><div class="n" id="d-exp">0</div>Expired</div>
    <div class="card orange"><div class="n" id="d-alert">0</div>Expiring ≤4 mo</div>
    <div class="card orange"><div class="n" id="d-low">0</div>Low Stock</div>
    <div class="card blue"><div class="n" id="d-total">0</div>Medicines</div>
    <div class="card green"><div class="n" id="d-qty">0</div>Total Qty</div>
    <div class="card green"><div class="n" id="d-val">0.00</div>Stock Value</div>
  </div>

  <form id="f">
    <div><label>Store</label><input name="store" placeholder="Main Store" required></div>
    <div><label>Medicine Name</label><input name="name" placeholder="Paracetamol 500mg" required></div>
    <div><label>Expiry Date</label><input type="date" name="exp" required></div>
    <div><label>Sell Price</label><input type="number" step="0.01" min="0" name="sell" required></div>
    <div><label>Cost Price</label><input type="number" step="0.01" min="0" name="cost" required></div>
    <div><label>Quantity</label><input type="number" min="0" name="qty" required></div>
    <div><label>Quality</label>
      <select name="quality"><option>Good</option><option>Fair</option><option>Poor</option></select>
    </div>
    <div class="btns">
      <button class="primary" type="submit">➕ Add Medicine</button>
      <button class="ghost" type="button" id="csv">⬇ Export CSV</button>
      <button class="danger" type="button" id="clear">🗑 Clear All</button>
    </div>
  </form>

  <input class="search" id="search" placeholder="🔍 Search medicine or store…">
  <table>
    <thead><tr>
      <th>Store</th><th>Medicine</th><th>Expiry</th><th>Expiry Alert</th>
      <th>Sell</th><th>Cost</th><th>Qty</th><th>Quality</th><th>Stock Alert</th><th></th>
    </tr></thead>
    <tbody id="tb"></tbody>
  </table>
</div>

<script>
const KEY='medstock_v1';
const LOW=10, MONTHS=4;
let data = JSON.parse(localStorage.getItem(KEY) || '[]');
const save=()=>localStorage.setItem(KEY, JSON.stringify(data));

const fmt=n=>Number(n).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
const today=()=>{const d=new Date();d.setHours(0,0,0,0);return d};

function expiryStatus(dateStr){
  const exp=new Date(dateStr); exp.setHours(0,0,0,0);
  const t=today();
  const lim=new Date(t); lim.setMonth(lim.getMonth()+MONTHS);
  if(exp<t) return {txt:'EXPIRED', cls:'p-red'};
  if(exp<=lim) return {txt:`ALERT - ≤${MONTHS} months`, cls:'p-orange'};
  return {txt:'OK', cls:'p-green'};
}

function render(){
  const q=document.getElementById('search').value.toLowerCase();
  const tb=document.getElementById('tb'); tb.innerHTML='';
  let e=0,a=0,l=0,tq=0,tv=0;
  const rows=data.filter(r=>!q || r.name.toLowerCase().includes(q) || r.store.toLowerCase().includes(q));
  rows.forEach((r,i)=>{
    const st=expiryStatus(r.exp);
    const low = Number(r.qty)<=LOW;
    if(st.txt==='EXPIRED') e++;
    if(st.txt.startsWith('ALERT')) a++;
    if(low) l++;
    const tr=document.createElement('tr');
    tr.innerHTML=`
      <td>${r.store}</td>
      <td><b>${r.name}</b></td>
      <td>${new Date(r.exp).toLocaleDateString()}</td>
      <td><span class="pill ${st.cls}">${st.txt}</span></td>
      <td>${fmt(r.sell)}</td>
      <td>${fmt(r.cost)}</td>
      <td>${r.qty}</td>
      <td>${r.quality}</td>
      <td>${low?'<span class="pill p-orange">LOW STOCK</span>':'<span class="pill p-green">OK</span>'}</td>
      <td><button class="ghost" data-i="${data.indexOf(r)}">✕</button></td>`;
    tb.appendChild(tr);
  });
  // dashboard over ALL data
  data.forEach(r=>{tq+=Number(r.qty);tv+=Number(r.qty)*Number(r.cost);});
  document.getElementById('d-exp').textContent=e;
  document.getElementById('d-alert').textContent=a;
  document.getElementById('d-low').textContent=l;
  document.getElementById('d-total').textContent=data.length;
  document.getElementById('d-qty').textContent=tq;
  document.getElementById('d-val').textContent=fmt(tv);
}

document.getElementById('f').addEventListener('submit',ev=>{
  ev.preventDefault();
  const fd=new FormData(ev.target);
  data.push({
    store:fd.get('store'), name:fd.get('name'), exp:fd.get('exp'),
    sell:fd.get('sell'), cost:fd.get('cost'), qty:fd.get('qty'),
    quality:fd.get('quality')
  });
  save(); ev.target.reset(); render();
});

document.getElementById('tb').addEventListener('click',e=>{
  if(e.target.dataset.i!==undefined){
    data.splice(Number(e.target.dataset.i),1);
    save(); render();
  }
});

document.getElementById('search').addEventListener('input',render);

document.getElementById('csv').addEventListener('click',()=>{
  const h=['Store','Medicine','Expiry','Sell','Cost','Qty','Quality'];
  const rows=data.map(r=>[r.store,r.name,r.exp,r.sell,r.cost,r.qty,r.quality]);
  const csv=[h,...rows].map(r=>r.map(c=>`"${c}"`).join(',')).join('\n');
  const blob=new Blob([csv],{type:'text/csv'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='medicine-stock.csv'; a.click();
});

document.getElementById('clear').addEventListener('click',()=>{
  if(confirm('Delete all medicines?')){data=[];save();render();}
});

render();
</script>
</body>
  </html>
