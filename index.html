<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MedTrack Pro</title>
<style>
*{box-sizing:border-box;font-family:system-ui}body{margin:0;background:#f5f7fb}
header{background:#0d6efd;color:#fff;padding:16px;text-align:center}
.card{background:#fff;margin:12px;padding:14px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
input,button{width:100%;padding:12px;margin:6px 0;border:1px solid #ccc;border-radius:8px;font-size:15px}
button{background:#0d6efd;color:#fff;border:none;font-weight:700}
table{width:100%;border-collapse:collapse;margin-top:10px}th,td{border:1px solid #ddd;padding:8px;text-align:center}th{background:#eee}
</style>
</head>
<body>
<header><h2>💊 MedTrack Pro</h2></header>
<div class="card">
<input id="name" placeholder="Dawa ka Naam">
<input id="company" placeholder="Company">
<input id="cost" type="number" placeholder="Kharid Qeemat Rs">
<input id="qty" type="number" placeholder="Tadaad">
<input id="expiry" type="date">
<button onclick="add()">Save Karein</button>
</div>
<div class="card">
<table><thead><tr><th>Naam</th><th>Company</th><th>Qeemat</th><th>Tadaad</th><th>Expiry</th><th>X</th></tr></thead><tbody id="list"></tbody></table>
</div>
<script>
let data=JSON.parse(localStorage.getItem('medtrack_final')||'[]');
function save(){localStorage.setItem('medtrack_final',JSON.stringify(data));render()}
function add(){
let n=document.getElementById('name').value, c=document.getElementById('company').value, co=document.getElementById('cost').value, q=document.getElementById('qty').value, e=document.getElementById('expiry').value;
if(!n)return alert('Dawa ka naam likhein');
data.push({id:Date.now(),n,c,co,q,e});save();
document.getElementById('name').value='';document.getElementById('company').value='';document.getElementById('cost').value='';document.getElementById('qty').value='';
}
function render(){let tbody=document.getElementById('list');tbody.innerHTML='';data.forEach(m=>{tbody.innerHTML+=`<tr><td>${m.n}</td><td>${m.c}</td><td>${m.co}</td><td>${m.q}</td><td>${m.e}</td><td><button onclick="del(${m.id})" style="background:red">X</button></td></tr>`})}
function del(id){data=data.filter(x=>x.id!=id);save()}
render();
</script>
</body>
</html>
