<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Medicine Stock - Daily Profit</title>
<style>
  *{box-sizing:border-box;font-family:system-ui,Arial}
  body{margin:0;background:#f1f5f9}
  header{background:#0f766e;color:#fff;padding:14px 18px;display:flex;justify-content:space-between}
  .wrap{max-width:1150px;margin:auto;padding:12px}
  .dash{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
  .card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:12px;text-align:center}
  .card b{font-size:22px;display:block}
  .card span{font-size:11px;color:#64748b;font-weight:700;text-transform:uppercase}
  .form{background:#fff;padding:12px;border-radius:12px;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px;border:1px solid #e2e8f0}
  input{width:100%;padding:9px;border:1px solid #e2e8f0;border-radius:8px}
  button{padding:8px 12px;border:0;border-radius:8px;font-weight:700;cursor:pointer;font-size:13px}
  .primary{background:#0d9488;color:#fff} .ghost{background:#e2e8f0} .red{background:#fee2e2;color:#b91c1c} .blue{background:#dbeafe;color:#1e40af}
  .profitBox{background:#fff;border:2px solid #0d9488;border-radius:12px;padding:14px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
  .profitBox b{font-size:28px;color:#059669}
  table{width:100%;background:#fff;border-radius:12px;overflow:hidden;border-collapse:collapse;font-size:13px}
  th,td{padding:10px;border-bottom:1px solid #f1f5f9;text-align:left}
  th{background:#0f766e;color:#fff;font-size:11px}
  .pill{padding:4px 8px;border-radius:20px;font-size:11px;font-weight:700}
  .p-red{background:#fee2e2;color:#991b1b} .p-orange{background:#fef3c7;color:#92400e} .p-green{background:#dcfce7;color:#065f46}
</style>
</head>
<body>
<header><h1>💊 Medicine Stock - Daily Profit System</h1><small id="todayDate"></small></header>
<div class="wrap">

<!-- TODAY PROFIT BOX -->
<div class="profitBox">
  <div>
    <div style="font-size:12px;color:#64748b;font-weight:700">AAJ KA JAMA PROFIT</div>
    <b id="todayProfit">Rs 0.00</b>
    <div style="font-size:11px;color:#64748b" id="profitInfo">0 medicines sold today</div>
  </div>
  <div style="display:flex;gap:8px">
    <button class="blue" onclick="showHistory()">📊 History Dekho</button>
    <button class="red" onclick="eraseTodayProfit()">🗑 Erase - Naya Din Start</button>
  </div>
</div>

<div class="dash">
  <div class="card"><b id="d-total">0</b><span>Total Medicines</span></div>
  <div class="card"><b id="d-qty">0</b><span>Total Qty Left</span></div>
  <div class="card"><b id="d-exp">0</b><span>Expired</span></div>
  <div class="card"><b id="d-alert">0</b><span>Alert ≤6 Mo</span></div>
</div>

<div class="form">
  <div><label>Medicine Name</label><input id="name" placeholder="Panadol"></div>
  <div><label>Qty</label><input id="qty" type="number" min="1" value="1"></div>
  <div><label>Expiry Date</label><input id="exp" type="date"></div>
  <div><label>Cost Price</label><input id="cost" type="number" step="0.01" placeholder="100"></div>
  <div><label>Sale Price</label><input id="sell" type="number" step="0.01" placeholder="120"></div>
  <div style="display:flex;align-items:end"><button class="primary" onclick="addMed()">➕ Add Stock</button></div>
</div>

<table>
<thead><tr><th>#</th><th>Medicine</th><th>Qty Left</th><th>Expiry</th><th>Status</th><th>Cost</th><th>Sale</th><th>Sell</th></tr></thead>
<tbody id="tbody"></tbody>
</table>
</div>

<script>
const KEY='med_daily_profit_final';
let store=JSON.parse(localStorage.getItem(KEY)||'{"stock":[],"daily":{}}');
let stock=store.stock||[];
let daily=store.daily||{}; // { "2026-05-13": {profit:120, sales:3} }

function save(){ localStorage.setItem(KEY, JSON.stringify({stock, daily})); }
function todayStr(){ return new Date().toISOString().slice(0,10); }

document.getElementById('todayDate').textContent = new Date().toLocaleDateString();

function getStatus(expStr){
  const exp=new Date(expStr); const today=new Date(); today.setHours(0,0,0,0);
  const limit=new Date(today); limit.setMonth(limit.getMonth()+6);
  if(exp < today) return {t:'EXPIRED',c:'p-red'};
  if(exp <= limit) return {t:'≤6 Mo',c:'p-orange'};
  return {t:'OK',c:'p-green'};
}

function addMed(){
  const name=document.getElementById('name').value.trim();
  const qty=parseInt(document.getElementById('qty').value)||0;
  const exp=document.getElementById('exp').value;
  const cost=parseFloat(document.getElementById('cost').value)||0;
  const sell=parseFloat(document.getElementById('sell').value)||0;
  if(!name||!qty||!exp){ alert('Name, Qty, Expiry zaroori'); return; }
  stock.push({id:Date.now()+Math.random(), name, qty, exp, cost, sell});
  save(); render();
  document.getElementById('name').value=''; document.getElementById('qty').value=1;
}

function render(){
  const tb=document.getElementById('tbody'); tb.innerHTML='';
  let totalQty=0, expC=0, alertC=0;
  stock.sort((a,b)=> new Date(a.exp)-new Date(b.exp)).forEach((r,i)=>{
    const st=getStatus(r.exp);
    if(st.t==='EXPIRED') expC++; if(st.t==='≤6 Mo') alertC++;
    totalQty+=r.qty;
    const tr=document.createElement('tr');
    tr.innerHTML=`
      <td>${i+1}</td>
      <td><b>${r.name}</b></td>
      <td><b style="background:#f1f5f9;padding:4px 8px;border-radius:6px">${r.qty}</b></td>
      <td>${new Date(r.exp).toLocaleDateString()}</td>
      <td><span class="pill ${st.c}">${st.t}</span></td>
      <td>${r.cost.toFixed(2)}</td>
      <td>${r.sell.toFixed(2)}</td>
      <td>
        <button class="primary" onclick="sellMed(${r.id})">Sell 1</button>
        <button class="ghost" onclick="sellMed(${r.id},5)">Sell 5</button>
        <button class="red" onclick="delMed(${r.id})">✕</button>
      </td>`;
    tb.appendChild(tr);
  });
  document.getElementById('d-total').textContent=stock.length;
  document.getElementById('d-qty').textContent=totalQty;
  document.getElementById('d-exp').textContent=expC;
  document.getElementById('d-alert').textContent=alertC;
  renderProfit();
}

function sellMed(id, qtySell=1){
  const r=stock.find(x=>x.id===id); if(!r) return;
  if(r.qty < qtySell){ alert('Stock khatam! Sirf '+r.qty+' bacha hai'); return; }
  r.qty -= qtySell;
  if(r.qty===0){ /* optional auto delete */ }
  const profitOne = (r.sell - r.cost) * qtySell;
  const t=todayStr();
  if(!daily[t]) daily[t]={profit:0, sales:0};
  daily[t].profit += profitOne;
  daily[t].sales += qtySell;
  save(); render();
}

function renderProfit(){
  const t=todayStr();
  const todayData = daily[t] || {profit:0, sales:0};
  document.getElementById('todayProfit').textContent = 'Rs ' + todayData.profit.toFixed(2);
  document.getElementById('profitInfo').textContent = todayData.sales + ' medicines sold today - ' + t;
}

function eraseTodayProfit(){
  const t=todayStr();
  if(confirm('Aaj ka profit Rs '+(daily[t]?.profit||0).toFixed(2)+' erase karke naya din start karna hai?\n\nYe history me save rahega.')){
    // Save to history before erase? Keep history but reset today
    // For naya din, we just delete today's entry
    delete daily[t];
    save(); renderProfit();
    alert('Aaj ka profit erase ho gaya. Ab naya profit jama hoga!');
  }
}

function showHistory(){
  let txt='📊 PROFIT HISTORY:\n\n';
  const keys=Object.keys(daily).sort().reverse();
  if(keys.length===0){ alert('Abhi koi profit history nahi'); return; }
  let totalAll=0;
  keys.forEach(k=>{
    txt+=`${k} : Rs ${daily[k].profit.toFixed(2)} (${daily[k].sales} sold)\n`;
    totalAll+=daily[k].profit;
  });
  txt+=`\n----------------\nTotal All Time Profit: Rs ${totalAll.toFixed(2)}`;
  alert(txt);
}

function delMed(id){ if(confirm('Delete stock?')){ stock=stock.filter(x=>x.id!==id); save(); render(); } }

render();
</script>
</body>
</html>
