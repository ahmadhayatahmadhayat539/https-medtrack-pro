<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Medicine Stock Management</title>
<style>
  :root{
    --bg:#f1f5f9; --card:#ffffff; --line:#e2e8f0; --text:#0f172a; --muted:#64748b;
    --primary:#0d9488; --primary-d:#0f766e;
  }
  *{box-sizing:border-box}
  body{margin:0;padding:20px;background:var(--bg);color:var(--text);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
  .wrap{max-width:1150px;margin:0 auto}
  h1{margin:0 0 4px;font-size:1.45rem}
  .sub{margin:0 0 18px;color:var(--muted);font-size:.88rem}

  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin-bottom:16px;box-shadow:0 1px 2px rgba(15,23,42,.05)}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
  label{display:block;font-size:.72rem;font-weight:700;letter-spacing:.03em;
    text-transform:uppercase;color:var(--muted);margin-bottom:5px}
  input{width:100%;padding:9px 10px;font-size:.9rem;font-family:inherit;
    border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--text)}
  input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(13,148,136,.15)}

  .actions{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
  button{font-family:inherit;font-size:.88rem;font-weight:600;border:0;border-radius:8px;
    padding:10px 18px;cursor:pointer;transition:.15s}
  .btn-primary{background:var(--primary);color:#fff}
  .btn-primary:hover{background:var(--primary-d)}
  .btn-ghost{background:#e2e8f0;color:#334155}
  .btn-ghost:hover{background:#cbd5e1}

  .stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
  .stat{flex:1;min-width:130px;background:var(--card);border:1px solid var(--line);
    border-radius:12px;padding:12px 14px}
  .stat b{display:block;font-size:1.35rem;line-height:1.2}
  .stat span{font-size:.7rem;color:var(--muted);text-transform:uppercase;
    letter-spacing:.04em;font-weight:700}

  .toolbar{display:flex;gap:12px;align-items:center;justify-content:space-between;
    flex-wrap:wrap;margin-bottom:12px}
  .toolbar input{max-width:280px}

  .tablewrap{overflow-x:auto;border-radius:12px;border:1px solid var(--line);background:#fff}
  table{width:100%;border-collapse:collapse;font-size:.88rem;min-width:840px}
  th{background:#f8fafc;text-align:left;padding:11px 12px;font-size:.7rem;
    text-transform:uppercase;letter-spacing:.04em;color:var(--muted);
    border-bottom:1px solid var(--line);white-space:nowrap}
  td{padding:11px 12px;border-bottom:1px solid #f1f5f9;vertical-align:middle}
  tbody tr:last-child td{border-bottom:0}
  tbody tr:hover{background:#f8fafc}
  .num{text-align:right;font-variant-numeric:tabular-nums}
  .idx{color:var(--muted);width:40px}
  .badge{display:inline-block;padding:4px 9px;border-radius:999px;font-size:.72rem;
    font-weight:700;white-space:nowrap}
  .b-ok{background:#dcfce7;color:#15803d}
  .b-warn{background:#fef3c7;color:#b45309}
  .b-exp{background:#fee2e2;color:#b91c1c}
  .muted{color:var(--muted)}
  .empty{text-align:center;color:var(--muted);padding:28px 12px}
  .rowbtns{display:flex;gap:6px}
  .iconbtn{border:1px solid var(--line);background:#fff;border-radius:7px;
    padding:5px 10px;font-size:.8rem;cursor:pointer;font-weight:600}
  .iconbtn:hover{background:#f1f5f9}
  .iconbtn.del{color:#b91c1c;border-color:#fecaca}
  .iconbtn.del:hover{background:#fef2f2}
  tr.alertrow td:first-child{box-shadow:inset 3px 0 0 #f59e0b}
  tr.expiredrow td:first-child{box-shadow:inset 3px 0 0 #dc2626}
</style>
</head>
<body>
<div class="wrap">

  <h1>Medicine Stock</h1>
  <p class="sub">Alert automatically turns ON 4 months before the expiry date.</p>

  <div class="stats">
    <div class="stat"><b id="s-total">0</b><span>Items</span></div>
    <div class="stat"><b id="s-warn" style="color:#b45309">0</b><span>Expiring ≤ 4 mo</span></div>
    <div class="stat"><b id="s-exp" style="color:#b91c1c">0</b><span>Expired</span></div>
    <div class="stat"><b id="s-qty">0</b><span>Total Qty</span></div>
  </div>

  <!-- ADD / EDIT FORM -->
  <form class="card" id="form" autocomplete="off">
    <div class="grid">
      <div><label>Medicine Name</label>
        <input id="f-name" required placeholder="e.g. Paracetamol 500mg"></div>
      <div><label>Expiry Date</label>
        <input id="f-exp" type="date" required></div>
      <div><label>Sell Price</label>
        <input id="f-sell" type="number" step="0.01" min="0" placeholder="0.00"></div>
      <div><label>Cost Price</label>
        <input id="f-cost" type="number" step="0.01" min="0" placeholder="0.00"></div>
      <div><label>Quantity</label>
        <input id="f-qty" type="number" step="1" min="0" placeholder="0"></div>
    </div>
    <div class="actions">
      <button type="submit" class="btn-primary" id="btn-save">Add Medicine</button>
      <button type="button" class="btn-ghost" id="btn-cancel" style="display:none">Cancel</button>
    </div>
  </form>

  <!-- TABLE -->
  <div class="card">
    <div class="toolbar">
      <input id="search" placeholder="Search medicine...">
      <span class="muted" style="font-size:.78rem">Saved automatically in this browser</span>
    </div>

    <div class="tablewrap">
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>Medicine Name</th>
            <th>Expiry Date</th>
            <th>Alert Status</th>
            <th class="num">Sell Price</th>
            <th class="num">Cost Price</th>
            <th class="num">Qty</th>
            <th>Edit</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>

</div>

<script>
const KEY = 'medicine_stock_v1';
let medicines = JSON.parse(localStorage.getItem(KEY) || '[]');
let editId = null;

const $ = id => document.getElementById(id);
const tbody = $('tbody');

/* ---------- helpers ---------- */
function minusMonths(date, months){
  const d = new Date(date.getTime());
  const day = d.getDate();
  d.setDate(1);
  d.setMonth(d.getMonth() - months);
  const lastDay = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
  d.setDate(Math.min(day, lastDay));
  return d;
}

function statusOf(expiry){
  const today = new Date(); today.setHours(0,0,0,0);
  const exp = new Date(expiry + 'T00:00:00');
  const days = Math.round((exp - today) / 86400000);

  if (days < 0)
    return { badge:'b-exp', text:'Expired ' + Math.abs(days) + ' d ago', row:'expiredrow' };

  const alertDate = minusMonths(exp, 4);          // alert line = 4 months before expiry
  if (today >= alertDate)
    return { badge:'b-warn', text:'Expires in ' + days + ' d', row:'alertrow' };

  return { badge:'b-ok', text:'OK', row:'' };
}

const fmtDate = s => new Date(s + 'T00:00:00')
  .toLocaleDateString(undefined, {day:'2-digit', month:'short', year:'numeric'});
const fmtMoney = n => Number(n || 0).toFixed(2);

function save(){ localStorage.setItem(KEY, JSON.stringify(medicines)); }

/* ---------- render ---------- */
function render(){
  const q = $('search').value.trim().toLowerCase();
  const list = medicines
    .filter(m => m.name.toLowerCase().includes(q))
    .sort((a,b) => a.expiry.localeCompare(b.expiry));   // most urgent first

  tbody.innerHTML = '';

  if (!list.length){
    tbody.innerHTML = '<tr><td colspan="8" class="empty">No medicines yet — add one above.</td></tr>';
  } else {
    list.forEach((m, i) => {
      const st = statusOf(m.expiry);
      const tr = document.createElement('tr');
      if (st.row) tr.className = st.row;
      tr.innerHTML = `
        <td class="idx">${i + 1}</td>
        <td><strong>${escapeHtml(m.name)}</strong></td>
        <td>${fmtDate(m.expiry)}</td>
        <td><span class="badge ${st.badge}">${st.text}</span></td>
        <td class="num">${fmtMoney(m.sell)}</td>
        <td class="num">${fmtMoney(m.cost)}</td>
        <td class="num">${m.qty}</td>
        <td>
          <div class="rowbtns">
            <button class="iconbtn" data-edit="${m.id}">Edit</button>
            <button class="iconbtn del" data-del="${m.id}">Delete</button>
          </div>
        </td>`;
      tbody.appendChild(tr);
    });
  }

  // stats
  let warn = 0, exp = 0, qty = 0;
  medicines.forEach(m => {
    const st = statusOf(m.expiry);
    if (st.badge === 'b-exp') exp++;
    else if (st.badge === 'b-warn') warn++;
    qty += Number(m.qty) || 0;
  });
  $('s-total').textContent = medicines.length;
  $('s-warn').textContent  = warn;
  $('s-exp').textContent   = exp;
  $('s-qty').textContent   = qty;
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ---------- form ---------- */
$('form').addEventListener('submit', e => {
  e.preventDefault();

  const data = {
    name:   $('f-name').value.trim(),
    expiry: $('f-exp').value,
    sell:   parseFloat($('f-sell').value) || 0,
    cost:   parseFloat($('f-cost').value) || 0,
    qty:    parseInt($('f-qty').value, 10) || 0
  };
  if (!data.name || !data.expiry) return;

  if (editId){
    const i = medicines.findIndex(m => m.id === editId);
    if (i > -1) medicines[i] = { ...medicines[i], ...data };
  } else {
    data.id = Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
    medicines.push(data);
  }

  save(); render(); resetForm();
});

function resetForm(){
  editId = null;
  $('form').reset();
  $('btn-save').textContent = 'Add Medicine';
  $('btn-cancel').style.display = 'none';
  $('f-name').focus();
}

$('btn-cancel').addEventListener('click', resetForm);

/* ---------- table clicks ---------- */
tbody.addEventListener('click', e => {
  const editBtn = e.target.closest('[data-edit]');
  const delBtn  = e.target.closest('[data-del]');

  if (editBtn){
    const m = medicines.find(x => x.id === editBtn.dataset.edit);
    if (!m) return;
    editId = m.id;
    $('f-name').value = m.name;
    $('f-exp').value  = m.expiry;
    $('f-sell').value = m.sell;
    $('f-cost').value = m.cost;
    $('f-qty').value  = m.qty;
    $('btn-save').textContent = 'Update Medicine';
    $('btn-cancel').style.display = 'inline-block';
    window.scrollTo({ top: 0, behavior: 'smooth' });
    $('f-name').focus();
  }

  if (delBtn){
    const m = medicines.find(x => x.id === delBtn.dataset.del);
    if (m && confirm('Delete "' + m.name + '" from the stock list?')){
      medicines = medicines.filter(x => x.id !== m.id);
      if (editId === m.id) resetForm();
      save(); render();
    }
  }
});

$('search').addEventListener('input', render);

/* ---------- init ---------- */
render();
</script>
</body>
                                                                                  </html>
