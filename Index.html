<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MedTrack-Pro</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body{background:#eef2f7;font-family:sans-serif}
.box{max-width:550px;margin:20px auto;background:#fff;padding:20px;border-radius:15px;box-shadow:0 5px 15px rgba(0,0,0,0.1)}
.head{background:linear-gradient(135deg,#0d6efd,#0dcaf0);color:#fff;padding:15px;border-radius:10px;text-align:center}
.med{border-left:4px solid #0d6efd;padding:10px;margin-top:10px;background:#f8f9fa;border-radius:8px}
</style>
</head>
<body>
<div class="box">
<div class="head"><h3>💊 MedTrack-Pro</h3><p>Pharmacy System with Profit</p></div>
<div class="mt-3">
<input id="name" class="form-control mb-2" placeholder="Dawa ka naam">
<div class="row g-2">
<div class="col-6"><input id="qty" type="number" class="form-control" placeholder="Qty"></div>
<div class="col-6"><input id="expiry" type="date" class="form-control"></div>
</div>
<div class="row g-2 mt-1">
<div class="col-6"><input id="buy" type="number" class="form-control" placeholder="Kharid Price"></div>
<div class="col-6"><input id="sell" type="number" class="form-control" placeholder="Frokht Price"></div>
</div>
<button class="btn btn-primary w-100 mt-2" onclick="addMed()">Add Medicine +</button>
</div>
<div class="mt-3">
<h5>Total Profit: <span id="tProfit" class="text-success">0 Rs</span></h5>
<div id="list"></div>
</div>
</div>
<script>
let meds=JSON.parse(localStorage.getItem('meds')||'[]');
function addMed(){
let m={name:document.getElementById('name').value,qty:+document.getElementById('qty').value,buy:+document.getElementById('buy').value,sell:+document.getElementById('sell').value,expiry:document.getElementById('expiry').value,id:Date.now()};
if(!m.name)return alert('Naam likhein');
meds.push(m);localStorage.setItem('meds',JSON.stringify(meds));render();
document.getElementById('name').value='';document.getElementById('qty').value='';document.getElementById('buy').value='';document.getElementById('sell').value='';
}
function del(id){meds=meds.filter(x=>x.id!=id);localStorage.setItem('meds',JSON.stringify(meds));render();}
function render(){
let l=document.getElementById('list');l.innerHTML='';let tp=0;
meds.forEach(m=>{let p=(m.sell-m.buy)*m.qty;tp+=p;l.innerHTML+=`<div class="med"><b>${m.name}</b> - Qty:${m.qty}<br><small>Buy:${m.buy} Sell:${m.sell} Exp:${m.expiry}</small><br><span class="text-success fw-bold">Profit: ${p} Rs</span><button class="btn btn-sm btn-danger float-end" onclick="del(${m.id})">Del</button><div style="clear:both"></div></div>`});
document.getElementById('tProfit').innerText=tp+' Rs';
}
render();
</script>
</body>
</html>
